<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0d1321"/>
      <stop offset="100%" stop-color="#060910"/>
    </linearGradient>

    <!-- Watercolor Gradients -->
    <linearGradient id="fInkCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4FACFE" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="fInkPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF0080" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Watercolor Bleed Filter -->
    <filter id="fBleed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="screen"/>
    </filter>

    <style>
      .footer-quote {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
        font-size: 14.5px;
        font-style: italic;
        fill: #E2E8F0;
        letter-spacing: 0.4px;
      }
      .footer-credit {
        font-family: 'Fira Code', 'JetBrains Mono', monospace;
        font-size: 11.5px;
        letter-spacing: 2.5px;
        font-weight: 600;
        fill: #38BDF8;
      }
      .sparkle {
        animation: pulse 3s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.1); }
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="900" height="130" rx="16" fill="url(#footerBg)"/>
  <rect width="900" height="130" rx="16" fill="none" stroke="#1E293B" stroke-width="1.5" opacity="0.6"/>

  <!-- Top Fluid Ambient Line -->
  <path d="M0,2 Q225,10 450,3 T900,2" fill="none" stroke="url(#fInkCyan)" stroke-width="2" opacity="0.6"/>

  <!-- Watercolor Ink Morphing Waves -->
  <g filter="url(#fBleed)">
    <!-- Wave 1: Cyan Ink -->
    <path fill="url(#fInkCyan)" opacity="0.5">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="
          M-20,70 Q200,30 450,75 T920,60 L920,130 L-20,130 Z;
          M-20,60 Q220,90 450,55 T920,70 L920,130 L-20,130 Z;
          M-20,80 Q180,40 450,85 T920,50 L920,130 L-20,130 Z;
          M-20,70 Q200,30 450,75 T920,60 L920,130 L-20,130 Z
        "
        calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
    </path>

    <!-- Wave 2: Purple Ink -->
    <path fill="url(#fInkPurple)" opacity="0.45">
      <animate attributeName="d" dur="16s" repeatCount="indefinite"
        values="
          M-20,65 Q250,95 480,50 T920,80 L920,130 L-20,130 Z;
          M-20,75 Q220,45 450,80 T920,60 L920,130 L-20,130 Z;
          M-20,55 Q270,85 490,45 T920,75 L920,130 L-20,130 Z;
          M-20,65 Q250,95 480,50 T920,80 L920,130 L-20,130 Z
        "
        calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
    </path>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="40" r="3" fill="#00F2FE" opacity="0.7" class="sparkle"/>
  <circle cx="750" cy="45" r="3.5" fill="#A855F7" opacity="0.7" class="sparkle"/>

  <!-- Content Typography -->
  <g transform="translate(450, 52)">
    <text text-anchor="middle" class="footer-quote">"Crafting seamless e-commerce storefronts &amp; scalable full-stack MERN applications."</text>
  </g>

  <g transform="translate(450, 88)">
    <text text-anchor="middle" class="footer-credit">✦ SADIK RAHMAN • 2026 ✦</text>
  </g>
</svg>
